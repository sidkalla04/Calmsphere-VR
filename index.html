<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CalmSphere VRET</title>
  <link rel="stylesheet" href="styles.css">
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Add A-Frame extras for video controls -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script type="module" src="api.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="info-panel">
    CalmSphere VRET - Height Exposure Therapy
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  
  <div class="breathing-guide" id="breathingGuide">
    Take slow, deep breaths...
  </div>
  
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div>Loading your therapeutic environment...</div>
  </div>

  <!-- VR container -->
  <a-scene vr-mode-ui="enabled: true" loading-screen="enabled: false">
    <a-assets>
      <!-- Environment images for each level -->
      <img id="lvl1" src="height1.png" crossorigin="anonymous">
      <img id="lvl2" src="height2.jpg" crossorigin="anonymous">
      <!-- Video for level 3 -->
      <video id="lvl3" src="videoplayback.mp4" loop="true" crossorigin="anonymous"></video>
    </a-assets>

    <!-- Sky (360° environment) -->
    <a-sky id="sky" src="#lvl1" rotation="0 -130 0"></a-sky>
    <!-- This entity will hold our video for level 3 -->
    <a-videosphere id="videoSky" src="#lvl3" rotation="0 -130 0" visible="false"></a-videosphere>

    <!-- Calming visual element that follows user's view -->
    <a-entity id="calmIndicator" position="0 0 -1" rotation="0 0 0" scale="0.02 0.02 0.02" visible="false">
      <a-ring color="#4CAF50" radius-inner="0.8" radius-outer="1" segments-theta="64"></a-ring>
    </a-entity>

    <!-- Instruction text -->
    <a-text id="instruction"
            value="Level 1: Step onto the balcony"
            position="0 1.8 -3" 
            align="center"
            color="#FFFFFF"
            scale="0.8 0.8 0.8"
            font="kelsonsans"
            wrap-count="22">
    </a-text>

    <!-- Controls panel -->
    <a-entity id="controlPanel" position="0 1.2 -2">
      <!-- Next button -->
      <a-entity id="nextBtn" position="0 0 0" class="clickable" cursor-listener>
        <a-box depth="0.05" height="0.3" width="0.6" color="#4CAF50"
               animation__hover="property: material.color; to: #8BC34A; startEvents: mouseenter; dur: 200"
               animation__leave="property: material.color; to: #4CAF50; startEvents: mouseleave; dur: 200"></a-box>
        <a-text value="Next Level" position="0 0 0.03" align="center" color="#FFFFFF" scale="0.3 0.3 0.3"></a-text>
      </a-entity>
      
      <!-- Pause/breathe button -->
      <a-entity id="breatheBtn" position="-0.8 0 0" class="clickable" cursor-listener>
        <a-box depth="0.05" height="0.3" width="0.6" color="#2196F3"
               animation__hover="property: material.color; to: #64B5F6; startEvents: mouseenter; dur: 200"
               animation__leave="property: material.color; to: #2196F3; startEvents: mouseleave; dur: 200"></a-box>
        <a-text value="Take a Breath" position="0 0 0.03" align="center" color="#FFFFFF" scale="0.3 0.3 0.3"></a-text>
      </a-entity>
      
      <!-- Exit button -->
      <a-entity id="exitBtn" position="0.8 0 0" class="clickable" cursor-listener>
        <a-box depth="0.05" height="0.3" width="0.6" color="#F44336"
               animation__hover="property: material.color; to: #E57373; startEvents: mouseenter; dur: 200"
               animation__leave="property: material.color; to: #F44336; startEvents: mouseleave; dur: 200"></a-box>
        <a-text value="Exit" position="0 0 0.03" align="center" color="#FFFFFF" scale="0.3 0.3 0.3"></a-text>
      </a-entity>
    </a-entity>

    <!-- Camera + cursor for gaze interaction -->
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor id="cursor" fuse="true" fuse-timeout="1500" color="#FFFFFF"
                animation__fuse="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500; startEvents: fusing"
                animation__click="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150; startEvents: click"></a-cursor>
    </a-entity>
  </a-scene>
  <!-- Load scripts -->
 
</body>
</html>
