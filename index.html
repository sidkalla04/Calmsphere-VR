<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CalmSphere VRET</title>
  <link rel="stylesheet" href="styles.css">
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Add A-Frame extras for video controls -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script type="module" src="api.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="info-panel">
    <h1>CalmSphere VRET</h1>
    <p>Height Exposure Therapy</p>
  </div>
  
  <div class="progress-container">
    <div class="progress-label">Progress</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading your therapeutic environment...</div>
  </div>

  <!-- Dashboard Overlay -->
  <div id="dashboardOverlay" style="
    position: fixed; 
    top: 0; left: 0; right: 0; bottom: 0; 
    background: rgba(0,0,0,0.95); 
    z-index: 1000; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
  ">
    <h2 style="color: #fff; margin-bottom: 2rem;">Welcome to CalmSphere VRET</h2>
    <p style="color: #fff; margin-bottom: 2rem;">Select your phobia to begin therapy:</p>
    <button onclick="startTherapy('heights')" style="margin: 1rem; padding: 1rem 2rem; font-size: 1.2rem;">Fear of Heights</button>
    <button onclick="startTherapy('public-speaking')" style="margin: 1rem; padding: 1rem 2rem; font-size: 1.2rem;">Fear of Public Speaking</button>
    <button onclick="startTherapy('spiders')" style="margin: 1rem; padding: 1rem 2rem; font-size: 1.2rem;">Fear of Spiders</button>
  </div>

  <!-- Report Overlay -->
  <div id="reportOverlay" style="
    position: fixed; 
    top: 0; left: 0; right: 0; bottom: 0; 
    background: rgba(0,0,0,0.95); 
    z-index: 1001; 
    display: none; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    color: #fff;
  ">
    <h2>Session Report</h2>
    <div id="reportContent"></div>
    <button onclick="backToDashboard()" style="margin-top:2rem; padding: 1rem 2rem; font-size: 1.2rem;">Back to Dashboard</button>
  </div>

  <!-- VR container -->
  <a-scene vr-mode-ui="enabled: true" loading-screen="enabled: false">
    <a-assets>
      <!-- Environment images for each level -->
      <img id="lvl1" src="height1.png" crossorigin="anonymous">
      <img id="lvl2" src="height2.jpg" crossorigin="anonymous">
      <!-- Video for level 3 -->
      <video id="lvl3" 
             src="videoplayback.mp4" 
             loop="true" 
             crossorigin="anonymous"
             playsinline
             preload="auto"
             autoplay="false">
      </video>
    </a-assets>

    <!-- Sky (360° environment) -->
    <a-sky id="sky" src="#lvl1" rotation="0 -130 0"></a-sky>
    <!-- This entity will hold our video for level 3 -->
    <a-videosphere id="videoSky" 
                   src="#lvl3" 
                   rotation="0 -130 0" 
                   visible="false"
                   material="shader: flat; side: double">
    </a-videosphere>

    <!-- Breathing guide in VR space -->
    <a-entity id="vrBreathingGuide" position="0 1.6 -2" visible="false">
      <a-plane color="#000000" opacity="0.4" width="0.8" height="0.4" position="0 0 0"></a-plane>
      <a-text id="vrBreathingText" 
              value="Take slow, deep breaths..." 
              align="center" 
              position="0 0 0.01" 
              scale="0.4 0.4 0.4" 
              color="#FFFFFF"
              opacity="0.9">
      </a-text>
    </a-entity>

    <!-- Calming visual element that follows user's view -->
    <a-entity id="calmIndicator" position="0 0 -1" rotation="0 0 0" scale="0.02 0.02 0.02" visible="false">
      <a-ring color="#4CAF50" radius-inner="0.8" radius-outer="1" segments-theta="64" opacity="0.7"></a-ring>
    </a-entity>

    <!-- Instruction text - positioned higher and smaller -->
    <a-text id="instruction"
            value="Level 1: Step onto the balcony"
            position="0 2.1 -2.5" 
            align="center"
            color="#FFFFFF"
            opacity="0.8"
            scale="0.5 0.5 0.5"
            font="kelsonsans"
            wrap-count="30"
            baseline="center">
    </a-text>

    <!-- Controls panel - positioned lower to avoid overlap with instructions -->
    <a-entity id="controlPanel" position="0 0.9 -2">
      <!-- Next button -->
      <a-entity id="nextBtn" position="0 0 0" class="clickable" cursor-listener>
        <a-box depth="0.03" height="0.2" width="0.4" color="#4CAF50" radius="0.02" opacity="0.8"
               animation__hover="property: material.color; to: #8BC34A; startEvents: mouseenter; dur: 200"
               animation__leave="property: material.color; to: #4CAF50; startEvents: mouseleave; dur: 200"></a-box>
        <a-text value="Next Level" position="0 0 0.02" align="center" color="#FFFFFF" scale="0.2 0.2 0.2" opacity="0.9"></a-text>
      </a-entity>
      
      <!-- Pause/breathe button -->
      <a-entity id="breatheBtn" position="-0.5 0 0" class="clickable" cursor-listener>
        <a-box depth="0.03" height="0.2" width="0.4" color="#2196F3" radius="0.02" opacity="0.8"
               animation__hover="property: material.color; to: #64B5F6; startEvents: mouseenter; dur: 200"
               animation__leave="property: material.color; to: #2196F3; startEvents: mouseleave; dur: 200"></a-box>
        <a-text value="Breathe" position="0 0 0.02" align="center" color="#FFFFFF" scale="0.2 0.2 0.2" opacity="0.9"></a-text>
      </a-entity>
      
      <!-- Exit button -->
      <a-entity id="exitBtn" position="0.5 0 0" class="clickable" cursor-listener>
        <a-box depth="0.03" height="0.2" width="0.4" color="#F44336" radius="0.02" opacity="0.8"
               animation__hover="property: material.color; to: #E57373; startEvents: mouseenter; dur: 200"
               animation__leave="property: material.color; to: #F44336; startEvents: mouseleave; dur: 200"></a-box>
        <a-text value="Exit" position="0 0 0.02" align="center" color="#FFFFFF" scale="0.2 0.2 0.2" opacity="0.9"></a-text>
      </a-entity>
    </a-entity>

    <!-- Camera + cursor for gaze interaction -->
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor id="cursor" fuse="true" fuse-timeout="1500" color="#FFFFFF"
                animation__fuse="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500; startEvents: fusing"
                animation__click="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150; startEvents: click"></a-cursor>
    </a-entity>
  </a-scene>
  
  <script>
    let sessionStartTime = null;
    let selectedPhobia = null;
    let levelsCompleted = 1; // Start at 1 since user starts at level 1

    document.addEventListener('DOMContentLoaded', () => {
      // VR instructions visibility in VR mode
      const scene = document.querySelector('a-scene');
      const instruction = document.querySelector('#instruction');
      scene.addEventListener('enter-vr', () => {
        instruction.setAttribute('visible', 'false');
      });
      scene.addEventListener('exit-vr', () => {
        instruction.setAttribute('visible', 'true');
      });

      // Add event listener to Exit button ONCE
      const exitBtn = document.querySelector('#exitBtn');
      if (exitBtn) {
        exitBtn.addEventListener('click', endSessionAndShowReport);
      }

      // Add event listener to Next Level button to increment levelsCompleted
      const nextBtn = document.querySelector('#nextBtn');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          levelsCompleted += 1;
        });
      }
    });

    function startTherapy(phobia) {
      // Hide the dashboard overlay
      document.getElementById('dashboardOverlay').style.display = 'none';

      // Store the selected phobia and start time
      selectedPhobia = phobia;
      sessionStartTime = new Date();
      levelsCompleted = 1; // Reset for new session

      // Set the instruction text and (optionally) assets based on phobia
      const instruction = document.querySelector('#instruction');
      if (phobia === 'heights') {
        instruction.setAttribute('value', 'Level 1: Step onto the balcony');
      } else if (phobia === 'public-speaking') {
        instruction.setAttribute('value', 'Level 1: Step onto the stage');
      } else if (phobia === 'spiders') {
        instruction.setAttribute('value', 'Level 1: Approach the spider');
      }
    }

    function endSessionAndShowReport() {
      const endTime = new Date();
      let timeSpent = 0;
      if (sessionStartTime) {
        timeSpent = Math.round((endTime - sessionStartTime) / 1000); // seconds
      }
      const reportOverlay = document.getElementById('reportOverlay');
      const reportContent = document.getElementById('reportContent');
      reportContent.innerHTML = `
        <p><strong>Phobia Test Taken:</strong> ${selectedPhobia ? selectedPhobia.replace('-', ' ') : 'N/A'}</p>
        <p><strong>Levels Completed:</strong> ${levelsCompleted}</p>
        <p><strong>Time Spent:</strong> ${timeSpent} seconds</p>
      `;
      reportOverlay.style.display = 'flex';
    }

    function backToDashboard() {
      document.getElementById('reportOverlay').style.display = 'none';
      document.getElementById('dashboardOverlay').style.display = 'flex';
      // Optionally reset session variables
      sessionStartTime = null;
      selectedPhobia = null;
      levelsCompleted = 1;
      // Optionally reset VR scene to initial state if needed
    }
  </script>
</body>
</html>
